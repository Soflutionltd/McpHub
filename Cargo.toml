[package]
name = "mcp-hub"
version = "5.13.1"
edition = "2021"
authors = ["SOFLUTION LTD"]
description = "Local MCP hub: BM25 tool discovery, SSE transport, auto-start. Single binary; code mode needs Node."
license = "MIT"
repository = "https://github.com/Soflutionltd/McpHub"
keywords = ["mcp", "cursor", "proxy", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "McpHub"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
socket2 = { version = "0.5", features = ["all"] }
sha2 = "0.10"
md-5 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# McpHub sync : secrets chiffrés par phrase de passe (RustCrypto, pur Rust).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
scrypt = { version = "0.11", default-features = false }
minisign-verify = "0.3"
# Accès distant par relais : WebSocket sortant (rustls, même fournisseur que reqwest).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Notifications natives de Windows et Linux ; macOS passe par osascript (health.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(unix)'.dependencies]
# killpg : arrêter un serveur et tous ses descendants (déjà présent via tokio).
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
