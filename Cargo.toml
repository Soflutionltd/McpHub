[package]
name = "mcp-hub"
version = "5.10.0"
edition = "2021"
authors = ["SOFLUTION LTD"]
description = "Fastest MCP proxy — BM25 tool discovery + SSE transport + auto-start. Single binary, zero deps."
license = "MIT"
repository = "https://github.com/Soflutionltd/McpHub"
keywords = ["mcp", "cursor", "proxy", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "McpHub"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
socket2 = { version = "0.5", features = ["all"] }
notify-rust = "4"
sha2 = "0.10"
md-5 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# McpHub sync : secrets chiffrés par phrase de passe (RustCrypto, pur Rust).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
scrypt = { version = "0.11", default-features = false }
minisign-verify = "0.3"

[target.'cfg(unix)'.dependencies]
# killpg : arrêter un serveur et tous ses descendants (déjà présent via tokio).
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
