    <polygon points="369.1,142.9 369.1,369.1 142.9,369.1 142.9,142.9" stroke-opacity=".22" stroke-width="2"/>
    <polygon points="256.0,96.0 416.0,256.0 256.0,416.0 96.0,256.0" stroke-opacity=".14" stroke-width="2"/>
