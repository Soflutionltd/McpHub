  </g>
  <circle cx="256.0" cy="96.0" r="14" fill="#F5B301"/><circle cx="256.0" cy="96.0" r="5" fill="#FFF7DB"/><circle cx="369.1" cy="142.9" r="14" fill="#F5B301"/><circle cx="369.1" cy="142.9" r="5" fill="#FFF7DB"/><circle cx="416.0" cy="256.0" r="14" fill="#F5B301"/><circle cx="416.0" cy="256.0" r="5" fill="#FFF7DB"/><circle cx="369.1" cy="369.1" r="14" fill="#F5B301"/><circle cx="369.1" cy="369.1" r="5" fill="#FFF7DB"/><circle cx="256.0" cy="416.0" r="14" fill="#F5B301"/><circle cx="256.0" cy="416.0" r="5" fill="#FFF7DB"/><circle cx="142.9" cy="369.1" r="14" fill="#F5B301"/><circle cx="142.9" cy="369.1" r="5" fill="#FFF7DB"/><circle cx="96.0" cy="256.0" r="14" fill="#F5B301"/><circle cx="96.0" cy="256.0" r="5" fill="#FFF7DB"/><circle cx="142.9" cy="142.9" r="14" fill="#F5B301"/><circle cx="142.9" cy="142.9" r="5" fill="#FFF7DB"/>
  <circle cx="256" cy="256" r="46" fill="#FFF3C4"/>
  <circle cx="256" cy="256" r="32" fill="#FFE08A"/>
  <circle cx="256" cy="256" r="18" fill="#F5B301"/>
</g>
<text x="690" y="268" font-size="132" font-weight="800" letter-spacing="-4"><tspan fill="#0F172A">Mcp</tspan><tspan fill="#F5B301">Hub</tspan></text>
<text x="694" y="330" font-size="40" font-weight="600" fill="#475569" text-anchor="start" >One secure hub for all your MCP servers.</text>
<text x="694" y="378" font-size="26" font-weight="400" fill="#94A3B8" text-anchor="start" >Cursor, Claude, Windsurf and VS Code see 3 tools instead of 928.</text>
<g transform="translate(690,430)"><rect width="265" height="48" rx="24.0" fill="#fff" stroke="#E2E8F0" filter="url(#sh2)"/><circle cx="26" cy="24.0" r="6" fill="#F5B301"/><text x="42" y="31.2" font-size="20" font-weight="600" fill="#0F172A">99.9% fewer tokens</text></g>
<g transform="translate(971,430)"><rect width="254" height="48" rx="24.0" fill="#fff" stroke="#E2E8F0" filter="url(#sh2)"/><circle cx="26" cy="24.0" r="6" fill="#16A34A"/><text x="42" y="31.2" font-size="20" font-weight="600" fill="#0F172A">Sandboxed servers</text></g>
<g transform="translate(1241,430)"><rect width="299" height="48" rx="24.0" fill="#fff" stroke="#E2E8F0" filter="url(#sh2)"/><circle cx="26" cy="24.0" r="6" fill="#2563EB"/><text x="42" y="31.2" font-size="20" font-weight="600" fill="#0F172A">OAuth in the Keychain</text></g>
<g transform="translate(690,496)"><rect width="299" height="48" rx="24.0" fill="#fff" stroke="#E2E8F0" filter="url(#sh2)"/><circle cx="26" cy="24.0" r="6" fill="#7C3AED"/><text x="42" y="31.2" font-size="20" font-weight="600" fill="#0F172A">Anti rug-pull pinning</text></g>
<g transform="translate(1005,496)"><rect width="164" height="48" rx="24.0" fill="#fff" stroke="#E2E8F0" filter="url(#sh2)"/><circle cx="26" cy="24.0" r="6" fill="#0D9488"/><text x="42" y="31.2" font-size="20" font-weight="600" fill="#0F172A">Code mode</text></g>
<g transform="translate(1185,496)"><rect width="265" height="48" rx="24.0" fill="#fff" stroke="#E2E8F0" filter="url(#sh2)"/><circle cx="26" cy="24.0" r="6" fill="#E11D48"/><text x="42" y="31.2" font-size="20" font-weight="600" fill="#0F172A">Single Rust binary</text></g>
<text x="1552" y="604" font-size="18" font-weight="500" fill="#94A3B8" text-anchor="end" >v5.8  ·  MIT  ·  macOS</text>
