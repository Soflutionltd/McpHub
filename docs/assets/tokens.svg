<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Token savings</title>
<defs>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.08"/>
  </filter>
  <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.4" fill="#E2E8F0"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fade" cx="50%" cy="45%" r="70%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="dotmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  <linearGradient id="amberbar" x1="0" x2="1">
    <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="redbar" x1="0" x2="1">
    <stop offset="0" stop-color="#FCA5A5"/><stop offset="1" stop-color="#EF4444"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
  </marker>
  
</defs>
<rect width="1600" height="560" fill="#FFFFFF"/>
<text x="80" y="92" font-size="40" font-weight="800" fill="#0F172A" text-anchor="start" >Context spent on tool definitions</text>
<text x="80" y="132" font-size="22" font-weight="400" fill="#475569" text-anchor="start" >Measured on a real setup with 35 MCP servers and 928 tools.</text>
<rect x="60" y="172" width="1120" height="320" rx="24" fill="#fff" stroke="#E2E8F0" filter="url(#sh)"/>
<text x="100" y="230" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" >Every server connected directly to the editor</text>
<text x="1140" y="230" font-size="22" font-weight="800" fill="#DC2626" text-anchor="end" >≈ 1,054,593 tokens</text>
<rect x="100" y="250" width="1040" height="44" rx="12" fill="url(#redbar)"/>
<text x="100" y="322" font-size="17" font-weight="400" fill="#475569" text-anchor="start" >928 tool definitions loaded into every conversation, more than most context windows.</text>
<text x="100" y="392" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" >Through McpHub</text>
<text x="1140" y="392" font-size="22" font-weight="800" fill="#B45309" text-anchor="end" >≈ 918 tokens</text>
<rect x="100" y="412" width="1040" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
<rect x="100" y="412" width="14" height="44" rx="7" fill="url(#amberbar)"/>
<text x="130" y="442" font-size="17" font-weight="600" fill="#475569" text-anchor="start" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" >3 tools: mcphub_search, mcphub_call, mcphub_run</text>
<rect x="1220" y="172" width="320" height="320" rx="24" fill="#0F172A" stroke="#0F172A" filter="url(#sh)"/>
<text x="1380" y="296" font-size="62" font-weight="800" fill="#F5B301" text-anchor="middle" >-99.9%</text>
<text x="1380" y="350" font-size="22" font-weight="600" fill="#E2E8F0" text-anchor="middle" >tokens per request</text>
<text x="1380" y="400" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle" >Schemas are loaded</text>
<text x="1380" y="426" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle" >only for the tool in use.</text>
<text x="80" y="528" font-size="16" font-weight="400" fill="#94A3B8" text-anchor="start" >Estimate: JSON size of the tool definitions divided by 4 characters per token.</text>
</svg>
